name: Build Windows

on:
  push:
    branches:
      - plugin
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run project checks
        shell: pwsh
        run: npm run check

      - name: Build Windows installer and portable package
        shell: pwsh
        run: npm run dist

      - name: List build outputs
        shell: pwsh
        run: Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DK-Data-Studio-Windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
