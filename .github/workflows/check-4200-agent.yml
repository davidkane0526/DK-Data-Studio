name: Check 4200 Diagnostic Agent

on:
  push:
    branches: ['4200']
    paths:
      - 'tools/4200-agent/**'
      - '.github/workflows/check-4200-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-static-check:
    name: Shell and PowerShell safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse Android shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/4200-agent/agent.sh tools/4200-agent/service.sh; do
            bash -n "$f"
            dash -n "$f"
          done
      - name: Verify read-only agent contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          a = Path("tools/4200-agent/agent.sh").read_text()
          s = Path("tools/4200-agent/service.sh").read_text()
          p = Path("tools/4200-agent/install.ps1").read_text()
          assert '/data/adb/dkds-agent' in a
          assert 'route get 169.254.111.118' in a
          assert 'diagnostics.log' in a
          assert '/data/adb/dkds-agent/agent.sh' in s
          assert 'Get-FileHash' in p and 'sha256sum' in p
          for value in ('pm install', 'adb uninstall', 'ip route add', 'ip route replace',
                        'iptables ', 'curl ', 'wget ', 'nc -', '*IDN?', 'forcev', 'forcei'):
            assert value not in a, f"Unsafe operation in agent.sh: {value}"
            assert value not in s, f"Unsafe operation in service.sh: {value}"
          print("4200 agent v0.1: read-only contract OK")
          PY
      - name: Parse Windows bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/4200-agent/install.ps1"),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "PowerShell syntax OK"

      - name: Compile standalone Android app_process helper
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          sdk="$ANDROID_HOME/platforms/android-36/android.jar"
          d8="$ANDROID_HOME/build-tools/36.0.0/d8"
          test -f "$sdk"
          test -x "$d8"
          mkdir -p tools/4200-agent/out/classes tools/4200-agent/out/dex
          javac -source 8 -target 8 \
            -cp "$sdk" \
            -d tools/4200-agent/out/classes \
            tools/4200-agent/java/DkdsUpdater.java
          "$d8" --min-api 26 --lib "$sdk" \
            --output tools/4200-agent/out/dex \
            tools/4200-agent/out/classes/com/dkds/agent/*.class
          test -s tools/4200-agent/out/dex/classes.dex
          (cd tools/4200-agent/out/dex && zip -q -j ../dkds-updater.jar classes.dex)
          unzip -t tools/4200-agent/out/dkds-updater.jar
          sha256sum tools/4200-agent/out/dkds-updater.jar
      - name: Upload standalone Android updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: dkds-4200-updater-${{ github.sha }}
          path: tools/4200-agent/out/dkds-updater.jar
          retention-days: 30
          if-no-files-found: error
      - name: Publish standalone agent preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/4200'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api repos/$GITHUB_REPOSITORY/branches/4200 --jq '.commit.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Superseded commit; artifact remains available in Actions."
            exit 0
          fi
          tag="4200-agent-preview-$GITHUB_RUN_ID"
          gh release create "$tag" \
            "tools/4200-agent/out/dkds-updater.jar#dkds-updater.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "4200 diagnostic agent · $GITHUB_RUN_ID" \
            --notes "Development helper for standalone KernelSU agent. No instrument commands. APK installation is disabled by default and must be locally approved." \
            --prerelease --latest=false
