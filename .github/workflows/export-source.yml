name: Export dev source snapshot

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/export-source.yml'
      - 'src/.export-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive source
        shell: bash
        run: |
          tar --exclude='./.git' -cJf "$RUNNER_TEMP/dev-source.tar.xz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: dev-source-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/dev-source.tar.xz
          if-no-files-found: error
          retention-days: 1
