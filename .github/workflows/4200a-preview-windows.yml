name: DKTS 4200A standalone Windows Preview
on:
  push:
    branches: [feat/4200a-fspro-rebuild]
    paths:
      - 'src/4200a-fspro/**'
      - 'src/core/**'
      - 'src/styles/**'
      - 'desktop/4200a-*.cjs'
      - 'scripts/4200a/**'
      - '.github/workflows/4200a-preview-windows.yml'
  pull_request:
    branches: ['4200']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dkts-fspro-preview-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-portable-preview:
    name: Dedicated read-only Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout 4200A rebuild
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone preview packager
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --ignore-scripts --no-save --no-audit --no-fund d3@7.9.0 electron-builder@26.0.12
      - name: Stage Windows app independently of DKDS native version
        shell: pwsh
        env:
          DKTS_UI_REVISION: a${{ github.run_number }}
          DKTS_ELECTRON_VERSION: '43.4.0'
        run: |
          node scripts/4200a/stage-windows-preview.cjs
          node --check .stage/4200a-windows/desktop/4200a-fspro-main.cjs
          node --check .stage/4200a-windows/desktop/4200a-routed-discovery.cjs
          node --check .stage/4200a-windows/src/4200a-fspro/editor.js
          node --check .stage/4200a-windows/src/4200a-fspro/discovery-ui.js
      - name: Build unsigned x64 portable preview (read-only KXCI)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder@26.0.12 --projectDir .stage/4200a-windows --win portable --x64 --publish never
      - name: Verify exact preview package and SHA-256
        id: artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path '.stage/4200a-windows/dist' -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one portable Windows EXE, found $($files.Count)" }
          $file = $files[0]
          if ($file.Length -lt 50000000) { throw "Suspiciously small Electron portable build" }
          $expected = "DKTS-4200A-Preview-V0.3.0-a${{ github.run_number }}-Windows-x64.exe"
          if ($file.Name -ne $expected) { throw "Unexpected release name: $($file.Name)" }
          Get-FileHash $file.FullName -Algorithm SHA256 | Format-List
          "filename=$($file.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "filepath=$($file.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload exact Windows portable preview
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-4200A-Preview-V0.3.0-a${{ github.run_number }}-Windows-x64
          path: .stage/4200a-windows/dist/*.exe
          if-no-files-found: error
      - name: Publish explicitly labeled preview GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/4200a-fspro-rebuild'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "DKTS-FSPro-V0.3.0-a${{ github.run_number }}-preview"
          $file = "${{ steps.artifact.outputs.filepath }}"
          $notes = @'
          **Preview ONLY. Not a validated measurement application.**

          - Dedicated Windows x64 portable DK Test Studio 4200A FS-Pro interface.
          - Can identify a 4200A and maintain a read-only TCP session (*IDN? and *OPT? only).
          - Edit Page, offline PagePlan, plotting of imported raw-data files.
          - **Measure and Repeat are disabled. No SMU/PMU output, real measurement execution, or emergency stop is enabled.**
          - Unsigned preview build. Windows SmartScreen may display a warning.
          - Native version: V0.3.0. UI build: a${{ github.run_number }}.
          - Does not replace DK Data Studio and does not upgrade existing DKTS.
          '@
          gh release create $tag $file --target "${{ github.sha }}" --title "DK Test Studio 4200A Preview V0.3.0 a${{ github.run_number }}" --notes "$notes" --prerelease
