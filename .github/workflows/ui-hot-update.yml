name: DKDS Fast UI Hot Update
on:
  push:
    branches: ['4200']
    paths:
      - 'src/styles/**'
      - 'src/mobile.css'
      - 'tools/updates/**'
      - 'package.json'
      - '.github/workflows/ui-hot-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dkds-ui-hot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hot-update:
    name: Publish verified CSS-only UI bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve stable app version and hot-update build ID
        run: node tools/updates/resolve-build-identity.cjs
      - name: Validate hot-update runtime
        run: |
          node --check src/core/host/ui-hot-runtime.js
          node --check desktop/ui-hot-update.js
          node --check tools/updates/build-ui-hot-bundle.js
      - name: Create verified hot-style bundle without native compilation
        run: |
          DKDS_UI_APP_VERSION="$DKDS_RELEASE_VERSION" DKDS_UI_BUILD_ID="$DKDS_HOT_BUILD_ID" node tools/updates/build-ui-hot-bundle.js dist/DKDS-UI-bundle.json
          test -s dist/DKDS-UI-bundle.json
          node -e "const x=require('./dist/DKDS-UI-bundle.json');if(x.schema!=='dkds-ui-v2'||x.appVersion!==process.env.DKDS_RELEASE_VERSION||x.buildId!==process.env.DKDS_HOT_BUILD_ID||Object.keys(x.files).length!==3)process.exit(1)"
          echo "Hot update identity: V$DKDS_RELEASE_VERSION $DKDS_HOT_BUILD_ID"
      - name: Publish UI-only update release
        if: github.ref == 'refs/heads/4200'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/4200" --jq '.commit.sha')"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'Newer branch commit exists; skip an obsolete UI bundle.'
            exit 0
          fi
          tag="dkds-ui-v${DKDS_RELEASE_VERSION}-${DKDS_HOT_BUILD_ID}"
          notes="Verified CSS-only UI resources for V${DKDS_RELEASE_VERSION} (${DKDS_HOT_BUILD_ID}). Apply from the DKDS version panel without replacing EXE/APK. The full Windows/Android installers for this same build identity are published by the platform build workflows."
          gh release create "$tag" dist/DKDS-UI-bundle.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DKDS UI Hot Update · V${DKDS_RELEASE_VERSION} · ${DKDS_HOT_BUILD_ID}" \
            --notes "$notes" \
            --prerelease --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets,tagName
