name: Build Android

on:
  push:
    branches:
      - dev
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'scripts/generate-brand-assets.js'
      - 'scripts/generate-plugin-index.js'
      - 'scripts/validate-plugins.js'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'scripts/generate-brand-assets.js'
      - 'scripts/generate-plugin-index.js'
      - 'scripts/validate-plugins.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android arm64 Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select preinstalled JDK 21
        shell: bash
        run: |
          test -n "${JAVA_HOME_21_X64:-}"
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Verify preinstalled Android toolchain
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          node --version
          npm --version
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install mobile dependencies
        working-directory: mobile
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Type-check mobile shell
        working-directory: mobile
        shell: bash
        run: npm run typecheck

      - name: Prepare offline web assets
        working-directory: mobile
        shell: bash
        run: npm run sync:web

      - name: Generate Android project
        working-directory: mobile
        shell: bash
        run: npx expo prebuild --platform android --clean

      - name: Verify CI signing key
        working-directory: mobile/android
        shell: bash
        run: |
          test -f app/debug.keystore
          keytool -list \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Build arm64 release APK
        working-directory: mobile/android
        shell: bash
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          echo "Packaged native ABIs:"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          printf '%s\n' "$ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release APK must contain arm64-v8a only; found: $ABIS"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p mobile-dist
          cp \
            mobile/android/app/build/outputs/apk/release/app-release.apk \
            mobile-dist/DK-Data-Studio-arm64-v8a-release.apk
          ls -lh mobile-dist

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: DK-Data-Studio-Android-arm64-release-${{ github.sha }}
          path: mobile-dist/DK-Data-Studio-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
