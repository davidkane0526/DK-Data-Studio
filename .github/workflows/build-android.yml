name: Build Android

on:
  push:
    branches:
      - plugin
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Show tool versions
        shell: bash
        run: |
          node --version
          npm --version
          java -version
          sdkmanager --version

      - name: Install mobile dependencies
        working-directory: mobile
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Type-check mobile shell
        working-directory: mobile
        shell: bash
        run: npm run typecheck

      - name: Prepare offline web assets
        working-directory: mobile
        shell: bash
        run: npm run sync:web

      - name: Generate Android project
        working-directory: mobile
        shell: bash
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: mobile/android
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p mobile-dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile-dist/DK-Data-Studio-debug.apk
          ls -lh mobile-dist

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: DK-Data-Studio-Android-${{ github.sha }}
          path: mobile-dist/DK-Data-Studio-debug.apk
          if-no-files-found: error
          retention-days: 30
