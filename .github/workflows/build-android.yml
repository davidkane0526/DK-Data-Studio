name: Build Android

on:
  push:
    branches:
      - plugin
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android arm64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      DKDS_LOCAL_RELEASE_SIGNING: '1'
      DKDS_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.DKDS_ANDROID_RELEASE_KEYSTORE_BASE64 }}
      DKDS_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.DKDS_ANDROID_RELEASE_STORE_PASSWORD }}
      DKDS_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.DKDS_ANDROID_RELEASE_KEY_ALIAS }}
      DKDS_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.DKDS_ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Show tool versions
        shell: bash
        run: |
          node --version
          npm --version
          java -version
          sdkmanager --version

      - name: Validate release signing secrets
        shell: bash
        run: |
          missing=0
          for name in \
            DKDS_ANDROID_RELEASE_KEYSTORE_BASE64 \
            DKDS_ANDROID_RELEASE_STORE_PASSWORD \
            DKDS_ANDROID_RELEASE_KEY_ALIAS \
            DKDS_ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/dkds-android-release.jks"
          printf '%s' "$DKDS_ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "DKDS_ANDROID_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$DKDS_ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$DKDS_ANDROID_RELEASE_KEY_ALIAS" >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Type-check mobile shell
        working-directory: mobile
        shell: bash
        run: npm run typecheck

      - name: Prepare offline web assets
        working-directory: mobile
        shell: bash
        run: npm run sync:web

      - name: Generate Android project
        working-directory: mobile
        shell: bash
        run: npx expo prebuild --platform android --clean

      - name: Build arm64 release APK
        working-directory: mobile/android
        shell: bash
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          echo "Packaged native ABIs:"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)"
          printf '%s\n' "$ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release APK must contain arm64-v8a only; found: $ABIS"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p mobile-dist
          cp \
            mobile/android/app/build/outputs/apk/release/app-release.apk \
            mobile-dist/DK-Data-Studio-arm64-v8a-release.apk
          ls -lh mobile-dist

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: DK-Data-Studio-Android-arm64-release-${{ github.sha }}
          path: mobile-dist/DK-Data-Studio-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
