name: DKTS 4200A standalone Android Preview
on:
  push:
    branches: [feat/4200a-fspro-rebuild]
  pull_request:
    branches: ['4200']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dkts-fspro-preview-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-preview:
    name: Compile standalone Android 35 (SMU output disabled)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout 4200A rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve common per-commit UI revision
        id: revision
        run: |
          set -euo pipefail
          number=$(git rev-list --count HEAD)
          [[ "$number" =~ ^[0-9]+$ ]]
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Common cross-platform revision a$number"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub runner Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDK manager: $SDKMANAGER"
      - name: Install Android API and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stage FS-Pro shared web assets
        env:
          DKTS_UI_REVISION: a${{ steps.revision.outputs.number }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund d3@7.9.0
          node tools/4200a-generate-brand-icons.cjs
          node scripts/4200a/stage-android-preview.cjs
          node --check src/4200a-fspro/android-bridge.js
          node --check src/4200a-fspro/discovery-ui.js
      - name: Compile Android preview with temporary CI debug identity
        env:
          DKTS_FSPRO_BUILD_NUMBER: ${{ steps.revision.outputs.number }}
        run: gradle -p android4200a :app:assembleDebug --no-daemon --stacktrace
      - name: Verify compile-only debug package, never publish it
        run: |
          test -s android4200a/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android4200a/app/build/outputs/apk/debug/app-debug.apk
          echo 'Debug certificate is ephemeral; no debug APK will be distributed.'
      - name: Enable Android emulator KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Start Android 35 emulator, launch and inspect shared FS-Pro UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          emulator-boot-timeout: 720
          disable-animations: true
          script: |
            set -e
            adb install -r android4200a/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n studio.dk.fspro.preview.debug/studio.dk.fspro.preview.MainActivity
            sleep 15
            mkdir -p artifacts/4200a-android-emulator
            adb logcat -d -s 'DKTS-FSPro-Ready:V' '*:S' > android4200a/emulator-ready.log
            adb logcat -d -s 'DKTS-FSPro-WebJS:V' '*:S' > artifacts/4200a-android-emulator/webjs-errors.log
            adb exec-out screencap -p > artifacts/4200a-android-emulator/launch-portrait.png
            test -s artifacts/4200a-android-emulator/launch-portrait.png
            cat android4200a/emulator-ready.log
            if ! grep -q 'FS_PRO_READY' android4200a/emulator-ready.log; then
              echo 'Android UI not ready; printing JavaScript diagnostics.'
              cat artifacts/4200a-android-emulator/webjs-errors.log
              exit 1
            fi
      - name: Upload emulator screenshot evidence only (never temporary-signature APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4200a-android-emulator-evidence
          path: |
            artifacts/4200a-android-emulator/
            android4200a/emulator-ready.log
          if-no-files-found: warn
      - name: Restore private fixed Android release-signing identity
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.DKTS_FSPRO_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DKTS_FSPRO_ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'signing=false' >> "$GITHUB_OUTPUT"
            echo 'No stable signing secrets: compile-only mode, no installable APK publication.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dkts-fspro-preview.p12"
          test -s "$RUNNER_TEMP/dkts-fspro-preview.p12"
          chmod 600 "$RUNNER_TEMP/dkts-fspro-preview.p12"
          echo 'signing=true' >> "$GITHUB_OUTPUT"
      - name: Build reproducibly signed Android Release APK
        if: steps.sign.outputs.signing == 'true'
        env:
          DKTS_FSPRO_BUILD_NUMBER: ${{ steps.revision.outputs.number }}
          DKTS_FSPRO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dkts-fspro-preview.p12
          DKTS_FSPRO_ANDROID_SIGNING_PASSWORD: ${{ secrets.DKTS_FSPRO_ANDROID_SIGNING_PASSWORD }}
        run: gradle -p android4200a :app:assembleRelease --no-daemon --stacktrace
      - name: Check signed APK and assign versioned filename
        if: steps.sign.outputs.signing == 'true'
        run: |
          apk=android4200a/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "DKTS-4200A-Preview-V0.3.13-a${{ steps.revision.outputs.number }}-Android.apk"
          sha256sum "DKTS-4200A-Preview-V0.3.13-a${{ steps.revision.outputs.number }}-Android.apk"
      - name: Upload signed standalone APK
        if: steps.sign.outputs.signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-4200A-Preview-V0.3.13-a${{ steps.revision.outputs.number }}-Android
          path: DKTS-4200A-Preview-V0.3.13-a${{ steps.revision.outputs.number }}-Android.apk
          if-no-files-found: error
      - name: Publish signed Android prerelease
        if: steps.sign.outputs.signing == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/feat/4200a-fspro-rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="DKTS-FSPro-Android-V0.3.13-a${{ steps.revision.outputs.number }}-preview"
          gh release create "$tag" "DKTS-4200A-Preview-V0.3.13-a${{ steps.revision.outputs.number }}-Android.apk" \
            --target "${{ github.sha }}" \
            --title "DK Test Studio 4200A Preview V0.3.13 a${{ steps.revision.outputs.number }} Android" \
            --notes "Read-only preview: *IDN? and *OPT? only. Measure/Repeat disabled. Stable repository key required; nativeVersion V0.3.13, uiRevision a${{ steps.revision.outputs.number }}. No real instrument measurement acceptance." \
            --prerelease
