name: One-Time DKDS Release and Run Cleanup
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/release-prune-once.yml']
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    if: github.repository == 'davidkane0526/DK-Data-Studio' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prune obsolete cross-project releases and cancelled dev runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='davidkane0526/DK-Data-Studio'
          Path('cleanup-record').mkdir(exist_ok=True)
          def gh(*args,optional=False):
              p=subprocess.run(['gh','api',*args],capture_output=True,text=True)
              if p.returncode and not optional: raise RuntimeError('gh api '+str(args)+': '+p.stderr[-700:])
              return p
          def get(route): return json.loads(gh(route).stdout)
          # Separate DKTS releases must already contain real Windows + Android builds.
          dkts=get('repos/davidkane0526/DK-Test-Studio/releases?per_page=30')
          assert any(not r.get('draft') and
              any(a['name'].startswith('DK-Test-Studio-Portable') for a in r.get('assets',[])) and
              any(a['name'].startswith('DK-Test-Studio-Android') for a in r.get('assets',[]))
              for r in dkts), 'DKTS independent releases missing, aborting'
          all_releases=[]
          for page in range(1,10):
              batch=get('repos/'+repo+'/releases?per_page=100&page='+str(page))
              all_releases.extend(batch)
              if len(batch)<100: break
          targets=[r for r in all_releases if
              str(r.get('tag_name','')).startswith(('DKTS-FSPro-','4200-'))]
          assert all(not r['tag_name'].startswith(('v','dkds-')) for r in targets)
          archive=[{'id':r['id'],'tag':r['tag_name'],'name':r.get('name'),
              'target':r.get('target_commitish'),'draft':r.get('draft'),
              'assets':[{'name':a['name'],'digest':a.get('digest'),
                        'size':a.get('size'),'url':a.get('browser_download_url')}
                        for a in r.get('assets',[])]} for r in targets]
          Path('cleanup-record/release-manifest.json').write_text(json.dumps(archive,indent=2,ensure_ascii=False))
          report={'release_count_before':len(all_releases),'requested_release_deletions':len(targets),
                  'deleted_releases':[],'deleted_cancelled_runs':[],'errors':[]}
          for n,r in enumerate(targets,1):
              tag=r['tag_name'];print(f'{n}/{len(targets)}: {tag}',flush=True)
              res=gh('-X','DELETE',f'repos/{repo}/releases/{r["id"]}',optional=True)
              if res.returncode:
                  report['errors'].append({'tag':tag,'phase':'release','error':res.stderr[-400:]})
                  continue
              report['deleted_releases'].append(tag)
              res=gh('-X','DELETE',f'repos/{repo}/git/refs/tags/{tag}',optional=True)
              if res.returncode and '404' not in res.stderr:
                  report['errors'].append({'tag':tag,'phase':'tag','error':res.stderr[-400:]})
              time.sleep(1.25)
          # Only cancelled dev runs from the burst of version-bump commits; never
          # delete successful/failed CI evidence or the current cleanup run.
          runs=get(f'repos/{repo}/actions/runs?branch=dev&per_page=100').get('workflow_runs',[])
          for run in runs:
              if run.get('conclusion')!='cancelled' or not run.get('created_at','').startswith('2026-11-11'): continue
              if str(run['id'])==os.environ.get('GITHUB_RUN_ID'): continue
              res=gh('-X','DELETE',f'repos/{repo}/actions/runs/{run["id"]}',optional=True)
              if res.returncode: report['errors'].append({'run':run['id'],'error':res.stderr[-400:]})
              else: report['deleted_cancelled_runs'].append(run['id'])
              time.sleep(0.3)
          Path('cleanup-record/summary.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## One-time DKDS cleanup\n')
              out.write(f'- Removed unrelated DKTS/4200A releases: **{len(report["deleted_releases"])} / {len(targets)}**\n')
              out.write(f'- Removed cancelled dev runs: **{len(report["deleted_cancelled_runs"])}**\n')
              out.write(f'- Failures: **{len(report["errors"])}**\n')
              out.write('- All `v*` and `dkds-*` releases preserved, including v3.72.4.\n')
          if report['errors']: raise RuntimeError('Some cleanup operations failed; see uploaded audit')
          PY
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DKDS-Cleanup-20261111-Audit
          path: cleanup-record/
          if-no-files-found: warn
          retention-days: 90
